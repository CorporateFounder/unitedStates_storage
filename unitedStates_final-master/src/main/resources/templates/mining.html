<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"/>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/citu-wallet.css">
    <script>
        function setDefaultValues() {
            var dollarField = document.querySelector('input[name="dollar"]');

            if (dollarField.value === "") {
                dollarField.value = "0";
            }

        }
    </script>

</head>
<body class="citu-wallet-page">

<header th:insert="blocks/header :: header"></header>


<main class="container mt-4 mb-5">
    <section class="citu-wallet-panel mb-4">
    <h3 th:text="${title}"/>

    <div class="alert alert-warning" role="alert">
        <h4>Legacy / pre-V35 mining controls</h4>
        <p>This is legacy/pre-V35 UI. Manual difficulty is legacy-only after V35.</p>
        <p><strong>Legacy default difficulty: 17.</strong> Keep the default unless you understand the pre-V35 mining behavior.</p>
        <p>V35 activation is scheduled at block 514291. Before block 514291, <code>v35Active=false</code> is expected. Do not confuse these controls, staking, or unstaking with V35 reward rules.</p>
        <p>These controls do not define the V35 mining or reward model.</p>
        <p>Mining/pool configuration in this wallet is legacy / pre-V35 support. A node operator should run a local node at <code>http://127.0.0.1:8083</code>; simple wallet users may connect to the official public node <code>http://194.87.236.238:82</code>.</p>
        <p>Use the <a href="/v35-dashboard" class="alert-link">V35 dashboard</a> for the prepared V35 protocol model.</p>
    </div>

    <form action="/constantMining" class="mt-3">
        <button type="submit" class="btn btn-success">start</button>
    </form>



    </section>
    <section class="citu-wallet-panel mb-4">
    <h3 th:text="'Current legacy custom difficulty: '+${customDiff}"/>
    <form action="/customDiff" class="mt-1" method="post">
        <input type="text" name="customDiff" placeholder="17 legacy default" class="form-control"><br>
        <button type="submit" class="btn btn-success">change custom diff</button>
    </form>
    </section>

    <section class="citu-wallet-panel mb-4">
    <h3 class="h4">Legacy staking transaction</h3>
    <form action="/staking" class="mt-1" method="post" onsubmit="setDefaultValues()">
        <input type="text" name="miner" placeholder="enter the your address:" class="form-control"><br>
        <input type="text" name="dollar" placeholder="enter the citu (not les 0.01):" class="form-control"><br>
        <textarea name="password" placeholder="enter private key" rows="8" class="form-control"></textarea><br>
        <button type="submit" class="btn btn-success">send transaction staking</button>
    </form>
    </section>

    <section class="citu-wallet-panel">
    <h3 class="h4">Legacy unstaking transaction</h3>
    <form action="/unstaking" class="mt-1" method="post" onsubmit="setDefaultValues()">
        <input type="text" name="miner" placeholder="enter the your address:" class="form-control"><br>
        <input type="text" name="dollar" placeholder="enter the citu (not les 0.01): " class="form-control"><br>
        <textarea name="password" placeholder="enter private key" rows="8" class="form-control"></textarea><br>
        <button type="submit" class="btn btn-success">send transaction unstaking</button>
    </form>
    </section>
</main>


<footer th:insert="blocks/footer :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
