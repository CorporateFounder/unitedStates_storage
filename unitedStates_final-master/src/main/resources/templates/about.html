<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>About CITU wallet</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/citu-wallet.css">
</head>
<body class="citu-wallet-page">
<header th:insert="blocks/header :: header"></header>
<main class="container mb-5">
    <section class="citu-wallet-panel citu-wallet-hero mb-4">
        <img src="/images/citu-v35-logo.jpg" alt="Official CITU logo" class="citu-wallet-home-logo"/>
        <div>
            <p class="citu-wallet-kicker">About</p>
            <h1 th:text="${title}">About CITU</h1>
            <p>Corporation International Trade Union wallet for local account, transaction, governance, and V35 status workflows.</p>
        </div>
    </section>
    <section class="citu-wallet-grid">
        <article class="citu-wallet-panel"><h2 class="h5">English</h2><p th:text="${eng}">About text</p></article>
        <article class="citu-wallet-panel"><h2 class="h5">Russian</h2><p th:text="${rus}">Описание</p></article>
    </section>
</main>
<footer th:insert="blocks/footer :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
