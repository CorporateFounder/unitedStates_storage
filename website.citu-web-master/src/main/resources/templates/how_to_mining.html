<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"/>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body class="v35-public">
<header th:insert="blocks/header :: header "></header>

<div class="container mt-4">
    <div class="content-section">
        <div class="alert alert-warning">
            <h2>Legacy / pre-V35 mining guide</h2>
            <p>This page preserves legacy mining calculators and historical formulas. It is not the V35 public mining model.</p>
            <p>For the prepared V35 model, read the <a href="/white_papper" class="alert-link">V35 protocol paper</a>. V35 activation is scheduled at block 514291; before block 514291, <code>v35Active=false</code> is expected.</p>
            <p>Run a local node with <code>java -jar citu-node-v35-activation-514291-1.0.0.jar --server.port=8083</code>, open local wallet <code>http://127.0.0.1:8082</code>, and use the <a href="/how_mining_pool" class="alert-link">mining pool status guide</a> for legacy pool notes.</p>
            <p>No founder burn has occurred. <code>BURN_ADDRESS</code> is an internal placeholder, not a public transfer destination.</p>
        </div>
        <h6>Note:</h6>
        <h6>new updating: Milton fridman: valid since 342201</h6>
        <a href="/white_papper" class="btn btn-info mt-3">View V35 protocol paper</a>
        <p th:text="${noteText}"></p>

        <h6>Instructions:</h6>
        <p th:text="${instructionsText}"></p>

<!--        <h6>Important Information:</h6>-->
<!--        <p th:text="${importantInfoText}"></p>-->

<!--        <h6>History:</h6>-->
<!--        <p th:text="${randomAndStakingText}"></p>-->

<!--        <h6>Updating: </h6>-->
<!--        <p th:text="${newReward}"></p>-->

<!--        <h6>Updating: </h6>-->
<!--        <p th:text="${newBigRandom}"></p>-->

<!--        <h6>Updating: </h6>-->
<!--        <p th:text="${udatingBigRandom}"></p>-->



        <h6>Calculator score staking</h6>
        <p>Your staking: <span th:text="${staking}"></span></p>
        <p>Your calculated score: <span th:text="${score}"></span></p>

        <!-- Форма для обновления значения staking -->
        <form action="#" th:action="@{/how_to_mining}" method="post">
            <div class="mb-3">
                <label for="stakingInput" class="form-label">Enter new staking value:</label>
                <input type="number" class="form-control" id="stakingInput" name="staking" step="0.01" value="0.0">
            </div>
            <button type="submit" class="btn btn-primary">Update staking</button>
        </form>

        <form action="#" th:action="@{/calculate_reward}" method="post">
            <div class="mb-3">
                <label for="difficultyInput" class="form-label">Enter difficulty:</label>
                <input type="number" class="form-control" id="difficultyInput" name="difficulty" step="1" required>
            </div>

            <div class="mb-3">
                <label for="multiplierInput" class="form-label">Enter MULTIPLIER:</label>
                <input type="number" class="form-control" id="multiplierInput" name="MULTIPLIER" step="1" required>
            </div>

            <div class="mb-3">
                <label for="indexInput" class="form-label">Enter index:</label>
                <input type="number" class="form-control" id="indexInput" name="index" step="1" required>
            </div>

            <button type="submit" class="btn btn-primary">Calculate Reward</button>
        </form>

        <div class="mt-4">
            <h6>Reward Results:</h6>
            <p>Reward for coefficient = 0: <span th:text="${rewardG0}"></span></p>
            <p>Reward for coefficient = 3: <span th:text="${rewardG3}"></span></p>
        </div>


    </div>
</div>

    </div>
</div>
<img  th:src="@{/mining/mining.png}"/>

<footer th:insert="blocks/footer :: footer"></footer>

</body>
</html>
