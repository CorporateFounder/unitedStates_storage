spring.datasource.hikari.pool-name=HikariCP

# ????????? ???? Actuator-??????????
management.endpoints.web.exposure.include=*

# Bounded peer response safety caps. These are defensive pre-parse limits for
# diagnostics/runtime stability and do not change consensus rules.
citu.peer.maxResponseBytes.default=1000000
citu.peer.maxWinnerListBytes=200000
citu.peer.maxTransactionsBytes=500000
citu.peer.maxSubBlocksBytes=750000
citu.peer.maxDataShortBytes=100000

# Stable production defaults: diagnostics are available, but disabled unless
# an operator explicitly enables them for a short investigation window.
citu.memoryForensics.enabled=true
citu.memoryForensics.file.enabled=true
citu.memoryForensics.verbose=false
citu.memoryForensics.lastTraces=3
citu.diagnostic.traces.enabled=true
citu.diagnostic.file.enabled=false

# Diagnostic log retention. Only whitelisted memory/gc/heapdump/diagnostic files
# under this directory are eligible; blockchain data and business logs are not
# touched by this cleanup.
citu.logs.cleanup.enabled=true
citu.logs.cleanupEveryBlocks=100
citu.logs.keepBlocks=5000
citu.logs.maxFileBytes=52428800
citu.logs.maxFiles=20
citu.logs.dir=C:\\server\\logs

# Stable peer/network limits for V35 public nodes. Peer sync is best-effort:
# local validation and local block persistence must not wait on slow peers.
citu.peer.maxPeersPerCycle=3
citu.peer.maxPeersPerTournamentCycle=3
citu.peer.maxPeersPerResolveCycle=3
citu.peer.maxPeersPerPropagationCycle=3
citu.peer.maxPeersPerReadinessCycle=3
citu.peer.maxHealthEntries=32
citu.peer.maxErrorEntries=32
citu.peer.maxBlockedHostEntries=32
citu.peer.randomizePeerSelection=true
citu.peer.preferHealthyPeers=true
citu.peer.skipQuarantinedPeers=true
citu.peer.skipSelfPeers=true
citu.peer.skipStalePeers=true
citu.peer.maxRemoteCallsPerCycle=6
citu.peer.maxRemoteCallsPerMinute=60
citu.peer.maxRemoteCallDurationMs=3000
citu.peer.connectTimeoutMs=2000
citu.peer.readTimeoutMs=3000
citu.resolve.maxDurationMs=5000
citu.resolve.maxPeersPerCycle=3
citu.resolve.skipQuarantinedPeers=true
citu.resolve.skipStalePeers=true
citu.resolve.skipSelfPeers=true
citu.tournament.peerBudgetMs=3000
citu.tournament.maxPeerCalls=3
citu.tournament.skipPeerSyncIfLocalCandidateExists=true
citu.peer.propagation.maxPeers=3
citu.peer.propagation.timeoutMs=3000
citu.peer.propagation.bestEffort=true
citu.peer.staleBehindBlocks=1000
citu.peer.staleQuarantineMinutes=30
citu.peer.timeoutQuarantineMinutes=10
citu.peer.failureQuarantineMinutes=15
citu.peer.maxQuarantineMinutes=60
citu.peer.maxConsecutiveTimeoutsBeforeQuarantine=2
citu.peer.maxConsecutiveFailuresBeforeQuarantine=3
citu.memoryGuard.skipPeerWorkPercent=70
citu.memoryGuard.emergencyPeerWorkPercent=85
